  font-size: 12px;
  line-height: 20px;
}

.table-responsive {
  width: 100%;
  overflow-x: auto;
  scrollbar-width: thin;
}

.table {
  width: 100%;
  color: var(--foreground);
  font: inherit;
  text-align: start;
  border-collapse: separate;
  border-spacing: 0;
  font-size: calc(var(--font-size-base) * 0.875);
  line-height: calc(var(--font-size-base) * 1.625);
  font-family: var(--font-sans);
}

.table :is(th, td) {
  padding-block: 10px;
  padding-inline: 0 24px;
  overflow-wrap: anywhere;
  border-bottom: 1px solid var(--border);
  text-align: start;
  vertical-align: top;
  border-bottom-color: color-mix(in srgb, var(--foreground) 5%, transparent);
}
.table :is(th, td):not(:last-child) {
  padding-inline-end: calc(var(--font-size-base) * 1.5);
}

.table-responsive &gt; .table :is(th, td) {
  overflow-wrap: break-word;
}

.table :is(th, td):last-child {
  padding-inline-end: 0;
}

.table :is(caption, thead th) {
  font-weight: 600;
}

.table thead :is(th, td) {
  border-bottom-color: var(--border-strong, var(--input));
  padding-block: calc(var(--font-size-base) / 2);
  line-height: var(--font-size-base);
}

.table tbody tr:last-child :is(th, td) {
  border-bottom: 0;
}
.table tbody :is(th, td) {
  padding-block: calc(var(--font-size-base) * 0.625);
}

.table.table-sm :is(th, td) {
  padding-block: 8px;
}

.table.table-sm :is(th, td):not(:last-child) {
  padding-inline-end: 16px;
}

.table :is(.text-end, [align=&quot;right&quot;]) {
  text-align: end;
  font-variant-numeric: tabular-nums;
}

.table :is(.text-center, [align=&quot;center&quot;]) {
  text-align: center;
}

.table .text-nowrap {
  white-space: nowrap;
}

#widget {
  display: flex;
  flex-direction: column;
  gap: 12px;
  width: 100%;
  padding: 0;
  background: transparent !important;
}

.card {
  min-width: 0;
  padding: 12px;
  overflow: hidden;
  overflow-wrap: break-word;
  border-radius: var(--radius-2xl);
  corner-shape: var(--corner-shape);
  color: var(--card-foreground);
  background: var(--card);
}

.widget {
  min-width: 0;
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-lg);
  corner-shape: var(--corner-shape);
  box-shadow: 0 0 0 0.5px var(--border-strong, var(--border));
  color: var(--foreground);
  background: var(--background);
}

#widget &gt; :not(.card, .widget, .progress) {
  width: 100% !important;
  max-width: none !important;
  margin: 0 !important;
  padding: 0 !important;
  border: 0 !important;
  border-radius: 0 !important;
  background: transparent !important;
  box-shadow: none !important;
}

.tooltip {
  position: fixed;
  z-index: 50;
  top: 0;
  left: 0;
  width: max-content;
  max-width: min(
    20rem,
    var(--tooltip-available-width, calc(100vw - 10px)),
    calc(100vw - 10px)
  );
  max-height: min(
    var(--tooltip-available-height, calc(100vh - 10px)),
    calc(100vh - 10px)
  );
  border: 1px solid var(--border);
  corner-shape: var(--corner-shape);
  overflow-wrap: break-word;
  white-space: normal;
  pointer-events: none;
  user-select: none;
  font-family: var(--font-sans);
  padding: 5px 12px;
  border-color: color-mix(
    in oklab,
    light-dark(var(--primary-foreground), var(--foreground)) 5%,
    transparent
  );
  border-radius: var(--radius-2xl);
  color: light-dark(var(--primary-foreground), var(--foreground));
  background: light-dark(var(--foreground), var(--popover));
  box-shadow: 0 8px 18px rgb(15 23 42 / 20%);
  letter-spacing: -0.15px;
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: 600;
  line-height: 18px;
  text-align: center;
}

.viz-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(max(180px, 24%), 1fr));
  gap: 10px;
}

.viz-stat {
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.viz-stat-value {
  font-size: var(--font-size-h2);
  font-weight: var(--font-weight-medium);
  line-height: 1.25;
}

.viz-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 10px;
}

hr {
  width: 100%;
  height: 1px;
  margin-block: 6px;
  border: 0;
  background: var(--border);
}

.nav {
  display: flex;
  min-width: 0;
  align-items: center;
  gap: 4px;
}

.progress {
  display: flex;
  height: 8px;
  margin-block: calc((var(--line-height-normal, 1.5em) - 8px) / 2);
  overflow: hidden;
  border: 0;
  border-radius: var(--radius-full);
  background: var(--muted);
}

.progress-bar:only-child {
  border-radius: var(--radius-full);
}

.progress-bar {
  height: 100%;
  flex-shrink: 0;
  border: 0;
  background: var(--viz-series-1);
}

.viz-badge {
  display: inline-flex;
  align-items: center;
  padding: 4px 8px;
  border-radius: var(--radius-sm);
  color: color-mix(in srgb, var(--foreground) 40%, var(--muted-foreground));
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-family: var(--font-sans);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1;
}

small,
.text-small {
  font-size: var(--font-size-small);
  line-height: var(--line-height-small);
}

.text-muted {
  color: var(--muted-foreground);
}

.tabular-nums {
  font-variant-numeric: tabular-nums;
}

.sr-only {
  position: absolute;
  width: 1px;
  height: 1px;
  padding: 0;
  overflow: hidden;
  clip: rect(0, 0, 0, 0);
  white-space: nowrap;
  border: 0;
}

.viz-controls {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 8px;
}

.viz-controls &gt; .form-label {
  display: grid;
  min-width: min(100%, 260px);
  flex: 1 1 280px;
  grid-template-columns: minmax(0, 1fr) auto;
  align-items: baseline;
  gap: 2px 12px;
  margin-bottom: 0;
}

.viz-controls &gt; .form-label &gt; :is(.form-control, .form-range, .form-select) {
  grid-column: 1 / -1;
}

.btn,
.nav-link,
.form-check-input,
.form-control,
.form-range,
.form-select {
  font: inherit;
}

/* Match inline alignment without overriding a containing flex or grid layout. */
.btn,
.nav-link,
.form-control,
.form-select,
.form-range,
.form-check {
  vertical-align: middle;
}

.btn,
.nav-link {
  appearance: button;
  display: inline-flex;
  inline-size: fit-content;
  max-inline-size: 100%;
  align-items: center;
  justify-content: center;
  gap: 4px;
  margin: 0;
  padding: 0 8px;
  -webkit-app-region: no-drag;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  cursor: var(--cursor-interaction, pointer);
  text-align: center;
  text-decoration: none;
  white-space: nowrap;
  user-select: none;
  -webkit-font-smoothing: inherit;
  font-family: var(--font-sans);
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  border-color: transparent;
  border-radius: var(--radius-full);
  color: var(--foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.btn {
  border-color: var(--border);
  color: var(--secondary-foreground);
  background: var(--secondary);
}

.btn:is(.btn-block, .viz-tile) {
  inline-size: 100%;
}

.btn.viz-tile {
  min-width: 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

a.btn {
  cursor: var(--cursor-interaction, pointer);
  text-decoration: none;
}

.btn:not(:disabled):hover {
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-link:not(:disabled):not([aria-disabled=&quot;true&quot;]):hover {
  background: color-mix(in srgb, var(--foreground) 10%, transparent);
}

.btn-primary {
  border-color: var(--border);
  color: var(--primary-foreground);
  background: var(--foreground);
  background-clip: border-box;
}

.btn-primary .text-muted {
  color: color-mix(in srgb, var(--primary-foreground) 50%, transparent);
}

.btn-primary:not(:disabled):hover {
  background: color-mix(in srgb, var(--foreground) 80%, transparent);
  background-clip: border-box;
}

.btn-ghost {
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.btn-ghost:not(:disabled):hover {
  color: var(--muted-foreground);
  background: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.nav-pills .nav-link {
  min-width: 0;
  border-color: transparent;
  color: var(--muted-foreground);
  background: transparent;
}

.nav-justified .nav-link {
  flex: 1 1 0;
  overflow-wrap: anywhere;
  white-space: normal;
}

.nav-pills .nav-link.active {
  color: var(--foreground);
  background: var(--muted);
}

/* Shared preview chrome; product styles stay inside each variant. */
.viz-dotted-background {
  background-image: radial-gradient(
    circle,
    color-mix(in srgb, var(--foreground) 14%, transparent) 0.8px,
    transparent 0.8px
  );
  background-position: center;
  background-size: 16px 16px;
}

.viz-carousel {
  position: relative;
  min-width: 0;
}

.viz-carousel:has(&gt; .viz-carousel-controls) {
  min-height: calc(60px + var(--viz-carousel-picker-height, 0px));
  padding-bottom: 60px;
}

.viz-carousel &gt; [data-variant][hidden] {
  display: none !important;
}

.viz-carousel &gt; [data-variant] {
  isolation: isolate;
}

.viz-carousel-controls {
  --viz-carousel-hover: light-dark(
    color-mix(in srgb, var(--foreground) 5.4%, transparent),
    color-mix(in srgb, var(--foreground) 7.8%, transparent)
  );
  position: absolute;
  z-index: 2;
  bottom: 8px;
  left: 50%;
  display: flex;
  width: max-content;
  /* Leave room for the host&#x27;s design-controls launcher at the trailing edge. */
  max-width: calc(100% - 96px);
  align-items: center;
  gap: 0;
  padding: 0;
  border: 1px solid var(--border);
  border-radius: 16px;
  color: var(--foreground);
  background: var(--background);
  font-family: var(--font-sans);
  /* Match the settings dropdown chrome independently of the content font size. */
  font-size: 13px;
  font-weight: var(--font-weight-normal);
  line-height: 18px;
  transform: translateX(-50%);
  user-select: none;
}

/* Keep authored mockup button styles out of the shared carousel chrome. */
.viz-carousel-controls button,
.viz-carousel-picker &gt; summary {
  display: flex !important;
  height: auto !important;
  min-height: 30px;
  align-items: center !important;
  justify-content: center !important;
  gap: 4px;
  padding: 0 6px !important;
  -webkit-app-region: no-drag;
  border: 0 !important;
  border-radius: 14px !important;
  color: inherit !important;
  background: transparent !important;
  font: inherit !important;
  -webkit-tap-highlight-color: transparent;
}

.viz-carousel-controls &gt; button,
.viz-carousel-picker &gt; summary {
  position: relative;
  isolation: isolate;
}

.viz-carousel-controls &gt; button {
  --icon-size: 16px;
  width: 30px !important;
  padding: 0 !important;
}

.viz-carousel-picker &gt; summary {
  padding-inline: 12px !important;
}

.viz-carousel-controls .viz-carousel-caret {
  width: 14px;
  height: 14px;
  flex: none;
  margin: 0;
  color: inherit;
  transform: rotate(180deg);
}

.viz-carousel-controls &gt; button &gt; svg,
.viz-carousel-controls .viz-carousel-caret,
.viz-carousel-count {
  opacity: 0.5;
}

.viz-carousel-controls &gt; button::before,
.viz-carousel-picker &gt; summary::before {
  position: absolute;
  z-index: -1;
  inset: 3px;
  border-radius: 12px;
  content: &quot;&quot;;
  pointer-events: none;
}

.viz-carousel-controls &gt; button:hover::before,
.viz-carousel-picker &gt; summary:hover::before {
  background: var(--viz-carousel-hover);
}

.viz-carousel-controls &gt; button,
.viz-carousel-controls [data-lucide],
.viz-carousel-controls .lucide {
  flex-shrink: 0;
}

.viz-carousel-picker {
  min-width: 0;
}

.viz-carousel-picker &gt; summary {
  min-width: 0;
  list-style: none;
}

.viz-carousel-picker &gt; summary::-webkit-details-marker {
  display: none;
}

.viz-carousel-count {
  flex-shrink: 0;
  white-space: nowrap;
}

.viz-carousel-name {
  min-width: 0;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.viz-carousel-options {
  position: absolute;
  right: 0;
  bottom: calc(100% + 4px);
  left: 0;
  display: flex;
  max-height: 240px;
  flex-direction: column;
  gap: 2px;
  overflow: auto;
  padding: 4px;
  border: 1px solid var(--border);
  border-radius: var(--radius-lg);
  background: var(--background);
  box-shadow: 0 4px 12px light-dark(rgb(0 0 0 / 6%), rgb(0 0 0 / 25%));
}

.viz-carousel-options &gt; button {
  border-radius: max(0px, calc(var(--radius-lg) - 5px)) !important;
  width: 100% !important;
  min-height: 28px;
  justify-content: flex-start !important;
  padding: 4px 8px !important;
  font-size: var(--font-size-small) !important;
  text-align: start;
  white-space: normal;
  overflow-wrap: anywhere;
}

.viz-carousel-options &gt; [aria-current=&quot;true&quot;],
.viz-carousel-options &gt; button:hover {
  background: var(--viz-carousel-hover) !important;
}

.btn:disabled,
.nav-link:disabled,
.nav-link[aria-disabled=&quot;true&quot;] {
  cursor: not-allowed;
  opacity: 0.4;
}

[data-lucide] {
  stroke-width: 1.6;
}

.form-label {
  display: block;
  margin-bottom: 6px;
  color: var(--foreground);
}

.form-control {
  display: block;
  width: 100%;
  padding: 0 8px;
  outline: none;
  border: 1px solid var(--input);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  font-family: var(--font-sans);
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  padding-inline: calc(4px + var(--control-spacing, 12px) / 2);
  border-color: var(--input);
  border-radius: var(--radius-md);
  background: color-mix(in srgb, var(--popover) 96%, transparent);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 1.4285714286;
}
.form-control:is(
  [type=&quot;file&quot;],
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;],
  [type=&quot;color&quot;]
) {
  height: calc(12px + 2 * var(--control-spacing, 12px));
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  line-height: 18px;
}
.form-control:is(
  [type=&quot;date&quot;],
  [type=&quot;datetime-local&quot;],
  [type=&quot;month&quot;],
  [type=&quot;week&quot;]
) {
  padding-inline: var(--control-spacing, 12px);
}

.form-control::placeholder {
  color: var(--muted-foreground);
}

.form-control[type=&quot;file&quot;] {
  overflow: hidden;
  cursor: var(--cursor-interaction, pointer);
  padding: 0;
}

.form-control[type=&quot;file&quot;]::file-selector-button {
  padding: 0 8px;
  border: 0;
  border-right: 1px solid var(--input);
  color: var(--secondary-foreground);
  background: var(--secondary);
  cursor: inherit;
  font: inherit;
  min-height: calc(10px + 2 * var(--control-spacing, 12px));
  padding-inline: var(--control-spacing, 12px);
  margin-inline-end: var(--control-spacing, 12px);
}

.form-control[type=&quot;file&quot;]:not(:disabled):hover::file-selector-button {
  background: color-mix(in srgb, var(--foreground) 6%, var(--secondary));
}

.form-control-color[type=&quot;color&quot;] {
  width: 40px;
  height: calc(12px + 2 * var(--control-spacing, 12px));
  padding: 3px;
  cursor: var(--cursor-interaction, pointer);
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch-wrapper {
  padding: 0;
}

.form-control-color[type=&quot;color&quot;]::-webkit-color-swatch {
  border: 0;
  border-radius: calc(var(--radius-lg) - 4px);
  corner-shape: var(--corner-shape);
}

textarea.form-control {
  height: auto;
  resize: vertical;
  min-height: 96px;
  padding: 8px 10px;
}

.form-control:focus-visible {
  border-color: var(--ring);
  box-shadow: none;
}
.form-control:disabled {
  color: var(--muted-foreground);
  background: color-mix(in srgb, var(--foreground) 5%, transparent);
  opacity: 1;
}
.form-control[aria-invalid=&quot;true&quot;] {
  border-color: var(--red);
  box-shadow: 0 0 0 2px color-mix(in srgb, var(--red) 20%, transparent);
}

.form-control:disabled,
.form-select:disabled {
  cursor: not-allowed;
}

.form-select {
  appearance: none;
  display: block;
  width: 100%;
  height: fit-content;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  margin: 0;
  /* The secondary icon role is 14px at compact density and 16px at web density. */
  --icon-size: calc(10px + var(--control-spacing, 12px) / 2);
  /* Settings dropdowns retain a 12px inset and a 4px text-to-chevron gap. */
  padding: 0 calc(16px + var(--icon-size)) 0 12px;
  outline: none;
  border: 1px solid var(--border);
  border-radius: var(--radius-full);
  corner-shape: var(--corner-shape);
  color: var(--foreground);
  background-color: var(--secondary);
  background-image:
    linear-gradient(
      45deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    ),
    linear-gradient(
      135deg,
      transparent calc(50% - 0.6px),
      var(--muted-foreground) calc(50% - 0.6px) calc(50% + 0.6px),
      transparent calc(50% + 0.6px)
    );
  background-position:
    calc(100% - 12px - var(--icon-size) / 2) 50%,
    calc(100% - 12px - var(--icon-size) * 0.18) 50%;
  background-repeat: no-repeat;
  background-size: calc(var(--icon-size) * 0.32) calc(var(--icon-size) * 0.32);
  cursor: var(--cursor-interaction, default);
  font-size: calc(var(--font-size-base) * 14 / 16);
  font-size: round(nearest, calc(var(--font-size-base) * 14 / 16), 1px);
  font-weight: var(--font-weight-normal);
  line-height: 18px;
}

.form-select :is(option, optgroup) {
  color: var(--popover-foreground);
  background-color: var(--popover);
}

.form-select :is(option, optgroup):disabled {
  color: var(--muted-foreground);
}

.form-select:not(:disabled):hover {
  background-color: light-dark(
    color-mix(in srgb, var(--foreground) 5.5%, transparent),
    color-mix(in srgb, var(--foreground) 8%, transparent)
  );
}

.form-select:focus-visible {
  box-shadow: 0 0 0 2px var(--ring);
}
.form-select:disabled {
  opacity: 0.4;
}

.form-check {
  display: flex;
  min-height: calc(12px + 2 * var(--control-spacing, 12px));
  align-items: center;
  gap: 6px;
}

.form-check-input {
  appearance: none;
  width: 14px;
  height: 14px;
  flex: 0 0 auto;
  margin: 0;
  border: 1px solid var(--input);
  color: var(--primary-foreground);
  background-color: transparent;
  cursor: var(--cursor-interaction, default);
  transition:
    background-color 150ms,
    border-color 150ms,
    box-shadow 150ms;
}

.form-check:not(.form-switch) .form-check-input[type=&quot;checkbox&quot;] {
  corner-shape: round;
  box-shadow: var(--shadow-sm);
  position: relative;
  width: calc(10px + var(--control-spacing, 12px) / 2);
  height: calc(10px + var(--control-spacing, 12px) / 2);
  border-color: var(--border-strong, var(--input));
  border-radius: calc(var(--radius-sm) / 2);
  background-color: transparent;
  color: var(--foreground);
}

.form-check:not(.form-switch)
  .form-check-input:not(:disabled):not(:checked):hover {
  background-color: var(--card);
}

.form-check:not(.form-switch)
  .form-check-input[type=&quot;checkbox&quot;]:is(:checked, :indeterminate) {

@supports (border-radius: if(style(--corner-shape: round): 1px; else: 2px)) {

  .btn,

  .form-control,
  .form-select {

 &lt;h2&gt;报价依据与费用核验&lt;/h2&gt;
 &lt;p data-v3-status role=&quot;status&quot;&gt;&lt;/p&gt;
 &lt;details open&gt;&lt;summary&gt;① 店铺佣金与后台类目&lt;/summary&gt;
 &lt;p&gt;上方类目表用于查参考费率。后台类目、类型和实际计佣分类分别核验；更改类目后佣金不会自动改变。&lt;/p&gt;
 &lt;div class=&quot;oq-fields&quot;&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;佣金口径&lt;/span&gt;&lt;select data-v3-key=&quot;commissionMode&quot;&gt;&lt;option value=&quot;reference&quot;&gt;rFBS参考费率，OGL待确认&lt;/option&gt;&lt;option value=&quot;confirmed&quot;&gt;采用店铺核实的OGL费率&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;后台商品类目&lt;/span&gt;&lt;input data-v3-key=&quot;actualCategory&quot; type=&quot;text&quot; placeholder=&quot;完整后台类目路径或类目ID&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;后台商品类型&lt;/span&gt;&lt;input data-v3-key=&quot;actualType&quot; type=&quot;text&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;品牌（无品牌可填无品牌）&lt;/span&gt;&lt;input data-v3-key=&quot;actualBrand&quot; type=&quot;text&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;实际计佣分类与核验依据&lt;/span&gt;&lt;input data-v3-key=&quot;commissionEvidence&quot; type=&quot;text&quot; placeholder=&quot;费用页分类、订单号或账单日期&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;佣金核验日期&lt;/span&gt;&lt;input data-v3-key=&quot;commissionChecked&quot; type=&quot;date&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;≤1,500₽ 实际佣金 %&lt;/span&gt;&lt;input data-v3-key=&quot;actualCommission1&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;99.99&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;＞1,500–5,000₽ 实际佣金 %&lt;/span&gt;&lt;input data-v3-key=&quot;actualCommission2&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;99.99&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;＞5,000₽ 实际佣金 %&lt;/span&gt;&lt;input data-v3-key=&quot;actualCommission3&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;99.99&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;/div&gt;&lt;button type=&quot;button&quot; data-v3-confirm&gt;确认当前类目的佣金依据&lt;/button&gt;
 &lt;small&gt;官方表行号仅用于定位来源，不是后台类目ID。切换参考类目后需要重新确认。&lt;/small&gt;
 &lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;② 卖家售价、积分优惠与补偿&lt;/summary&gt;
 &lt;p&gt;建议售价按卖家活动后售价计算，包含卖家自己的优惠，尚未扣平台积分优惠。佣金、OGL货值以该售价为基数。积分补偿单列计入收入。&lt;/p&gt;
 &lt;div class=&quot;oq-fields&quot;&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;手动试算价格口径&lt;/span&gt;&lt;select data-v3-key=&quot;manualBasis&quot;&gt;&lt;option value=&quot;seller&quot;&gt;卖家活动后售价&lt;/option&gt;&lt;option value=&quot;cash&quot;&gt;买家现金实付（加回平台积分优惠）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;本件平台积分优惠 / ₽&lt;/span&gt;&lt;input data-v3-key=&quot;pointDiscount&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;预计可使用的积分补偿 / ₽&lt;/span&gt;&lt;input data-v3-key=&quot;pointCompensation&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;/div&gt;&lt;small&gt;积分补偿最多抵扣佣金的规则及可使用余额须按结算期核实；只填预计实际可用金额。未填补偿按0计，避免高估收入。&lt;/small&gt;
 &lt;p data-v3-prices&gt;&lt;/p&gt;
 &lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;③ 取消、退货、转售与销毁&lt;/summary&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;售后估算方式&lt;/span&gt;&lt;select data-v3-key=&quot;afterMode&quot;&gt;&lt;option value=&quot;reserve&quot;&gt;沿用经营设置中的售后预留比例&lt;/option&gt;&lt;option value=&quot;scenarios&quot;&gt;按互斥场景加权，替代统一售后预留&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;p&gt;各场景概率按全部订单估计，合计小于100%。净回收额＝可回收货值＋实收补偿－该场景已发生的运输、平台、处理及广告等费用；不再扣采购等初始成本与资金成本。可填负数。&lt;/p&gt;
 &lt;div class=&quot;oq-fields&quot; data-v3-scenarios&gt;&lt;/div&gt;
 &lt;small&gt;OGL集运仓取消件由快递员退回卖家仓库的费用已含在OGL运价，不再另加退回运费。WHD净回收需先扣专用佣金、适用税费（现行转售含22%增值税）及处理费。所有已发生费用均计入对应净回收额，避免重复扣除。&lt;/small&gt;
 &lt;p data-v3-risk&gt;&lt;/p&gt;
 &lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;④ 支付费率与已开通服务&lt;/summary&gt;
 &lt;p&gt;银行费率与提现费率填写在“经营设置”中。默认数值仅为试算假设；填入实际费率并记录依据后再标记已核实。&lt;/p&gt;
 &lt;div class=&quot;oq-fields&quot;&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;银行收单费计费基数&lt;/span&gt;&lt;select data-v3-key=&quot;bankBase&quot;&gt;&lt;option value=&quot;seller&quot;&gt;卖家活动后售价&lt;/option&gt;&lt;option value=&quot;cash&quot;&gt;买家现金实付&lt;/option&gt;&lt;option value=&quot;revenue&quot;&gt;现金＋可用积分补偿&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;提现费计费基数&lt;/span&gt;&lt;select data-v3-key=&quot;withdrawBase&quot;&gt;&lt;option value=&quot;platform&quot;&gt;平台扣费后的正余额&lt;/option&gt;&lt;option value=&quot;seller&quot;&gt;卖家活动后售价&lt;/option&gt;&lt;option value=&quot;cash&quot;&gt;买家现金实付&lt;/option&gt;&lt;option value=&quot;revenue&quot;&gt;现金＋可用积分补偿&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;支付费率核验状态&lt;/span&gt;&lt;select data-v3-key=&quot;feeConfirmed&quot;&gt;&lt;option value=&quot;no&quot;&gt;尚未核实&lt;/option&gt;&lt;option value=&quot;yes&quot;&gt;已按账单核实&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;银行及提现费用依据&lt;/span&gt;&lt;input data-v3-key=&quot;feeEvidence&quot; type=&quot;text&quot; placeholder=&quot;银行、支付渠道、账单或报价单；需含计费基数&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;支付费用核验日期&lt;/span&gt;&lt;input data-v3-key=&quot;feeChecked&quot; type=&quot;date&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;评价管理实际状态&lt;/span&gt;&lt;select data-v3-key=&quot;reviewPlan&quot;&gt;&lt;option value=&quot;off&quot;&gt;未开通&lt;/option&gt;&lt;option value=&quot;trial&quot;&gt;7天试用期内（0%）&lt;/option&gt;&lt;option value=&quot;first&quot;&gt;首个付费月（0.8%）&lt;/option&gt;&lt;option value=&quot;later&quot;&gt;第二个月起（1.3%）&lt;/option&gt;&lt;option value=&quot;proFirst&quot;&gt;Premium Pro优惠首月（0.4%）&lt;/option&gt;&lt;option value=&quot;proLater&quot;&gt;Premium Pro优惠后续（0.65%）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;订阅期内本件最高售价 / ₽&lt;/span&gt;&lt;input data-v3-key=&quot;highestPrice&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot;&gt;&lt;small&gt;0表示本次售价；实际按两者较大值估算。&lt;/small&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;其他已开通服务费率 / %&lt;/span&gt;&lt;input data-v3-key=&quot;extraServiceRate&quot; type=&quot;number&quot; min=&quot;0&quot; max=&quot;99.99&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;其他服务费单件分摊 / ¥&lt;/span&gt;&lt;input data-v3-key=&quot;extraServiceFixed&quot; type=&quot;number&quot; min=&quot;0&quot; step=&quot;0.01&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;其他服务及分摊依据&lt;/span&gt;&lt;input data-v3-key=&quot;extraServiceNote&quot; type=&quot;text&quot;&gt;&lt;/label&gt;
 &lt;/div&gt;&lt;small&gt;评价管理条款自2026-11-10起适用。请按真实开通日期判断所处阶段；退货时该项费用不退，须纳入相应场景净回收额。其他服务费率暂按本件最高售价估算，不同基数的费用请改填单件分摊。&lt;/small&gt;
 &lt;/details&gt;
 &lt;details&gt;&lt;summary&gt;⑤ 订单日期与费率版本&lt;/summary&gt;
 &lt;div class=&quot;oq-fields&quot;&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;订单日期或报价预计下单日&lt;/span&gt;&lt;input data-v3-key=&quot;orderDate&quot; type=&quot;date&quot;&gt;&lt;/label&gt;
 &lt;label class=&quot;oq-field&quot;&gt;&lt;span&gt;运输组织服务费判定状态&lt;/span&gt;&lt;select data-v3-key=&quot;orderStatus&quot;&gt;&lt;option value=&quot;delivered&quot;&gt;已签收／预计签收（收0.33%）&lt;/option&gt;&lt;option value=&quot;whd&quot;&gt;已通过仓库退回（收0.33%）&lt;/option&gt;&lt;option value=&quot;notDelivered&quot;&gt;尚未实际送达（暂不收0.33%）&lt;/option&gt;&lt;/select&gt;&lt;/label&gt;
